<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Number Guessing Game</title>
</head>
<body>
  <h1>Number Guessing Game</h1>
  <p>Guess a number from 1 to 100. You have 10 turns.</p>

  <label for="guessInput">Your guess:</label>
  <input type="number" id="guessInput" min="1" max="100">
  <button type="button" id="guessButton">Submit guess</button>

  <p id="previousGuesses">Previous guesses: None</p>
  <p id="feedback"></p>
  <p id="turnsLeft">Turns left: 10</p>

  <button type="button" id="restartButton" hidden>Play again</button>

  <script src="randominteger.js"></script>
  <script src="guessing-game.js"></script>
</body>
</html>
